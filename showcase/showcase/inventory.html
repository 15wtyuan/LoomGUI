<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Yio 靶子冻结 Showcase · 背包</title>
  <style>
  .root {display:flex;flex-direction:column; width:100vw; height:100vh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background-color:#0e1620; }
  .body {display:flex; flex-grow:1; flex-direction:row; gap:24px; padding:24px; overflow:hidden; }
  .col-list {display:flex; width:680px; flex-direction:column; gap:12px; overflow-y:auto; }
  .col-title { color:#e0e6ec; font-size:22px; font-weight:700; margin-bottom:4px; }
  .grid {display:flex; flex-direction:row; flex-wrap:wrap; gap:12px; }
  /* #116 content-box 适配：声明值 = 原 border-box 外框 − padding − 常驻透明 border。
     3px 透明左框常驻（content-box 下动态加框会外扩 3px 顶开兄弟；border-box 世界
     选中边框内含、外框恒 120）——.selected 只换色，外框两种状态逐像素稳定。 */
  .item {display:flex;flex-direction:column; width:97px; height:100px; background-color:rgba(21,36,51,0.72); border:3px solid transparent; border-radius:10px; padding:10px; gap:6px; align-items:center; position:relative; transition:transform .15s, background-color .15s; }
  .item:hover { transform:scale(1.05); background-color:rgba(26,47,69,0.85); }
  .item.selected { border-color:#d4a44e; }
  .item-icon { width:56px; height:56px; }
  .item-badge { position:absolute; top:6px; right:6px; background-color:#d4a44e; color:#0e1620; font-size:12px; font-weight:700; padding:1px 6px; border-radius:10px; }
  /* ProgressBar（item-dur）：控件本身是轨道，作者写 data-slot=fill 子节点（width:% 由 value 驱动） */
  .item-dur { width:80px; background-color:rgba(26,47,69,0.85); border-radius:3px; overflow:hidden; height:6px; }
  .item-dur [data-slot="fill"] { background-color:#5fb4d4; height:100%; }
  .col-detail {display:flex;flex-direction:column; flex-grow:1; background-color:rgba(21,36,51,0.72); border-radius:10px; padding:32px; gap:16px; overflow-y:auto; }
  .detail-icon { width:160px; height:160px; align-self:center; }
  .detail-name { color:#e0e6ec; font-size:30px; font-weight:700; align-self:center; }
  .detail-rarity { color:#d4a44e; font-size:15px; align-self:center; }
  .detail-desc { color:#9aa0b4; font-size:15px; line-height:1.7; }
  .detail-attrs {display:flex; flex-direction:row; gap:24px; justify-content:center; }
  .attr {display:flex; flex-direction:column; align-items:center; gap:4px; }
  .attr-val { color:#8ec5d8; font-size:22px; font-weight:700; }
  .attr-label { color:#6c7080; font-size:13px; }
  .detail-actions {display:flex; flex-direction:row; gap:12px; justify-content:center; margin-top:8px; }
  .btn { padding:10px 24px; border-radius:10px; font-size:15px; font-weight:700; }
  .btn-use { background-color:#5fb4d4; color:#08131a; box-shadow:0 0 0 1px rgba(95,180,212,0.5), 0 4px 14px rgba(95,180,212,0.22); }
  .btn-drop { background-color:rgba(194,96,90,0.12); color:#c2605a; box-shadow:inset 0 0 0 1px rgba(194,96,90,0.32); }
  .btn-use:hover { filter:brightness(1.1); transform:translateY(-1px); }
  .btn-drop:hover { background-color:rgba(194,96,90,0.2); box-shadow:inset 0 0 0 1px rgba(194,96,90,0.5); }
  </style>
</head>
<body>
  <div class="root">
    <page-top id="page-top"><span slot="title" class="pt-title" style="color:#e0e6ec;font-size:20px;font-weight:700">背包</span></page-top>
    <div class="body">
      <div class="col-list">
        <div class="col-title">物品 · ListView</div>
        <div role="list" id="inv-list" class="grid" data-fill="10">
          <template>
            <div role="listitem" class="item">
              <span class="item-badge">x9</span>
              <img class="item-icon" src="../res/icons/item-potion.png" alt="item">
              <div role="progressbar" class="item-dur" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"><div data-slot="fill"></div></div>
            </div>
          </template>
        </div>
      </div>
      <div class="col-detail">
        <img class="detail-icon" src="../res/icons/item-chest.png" alt="detail">
        <span class="detail-name">精铁宝箱</span>
        <span class="detail-rarity">史诗 · 可堆叠</span>
        <div class="detail-desc">从远古遗迹中发掘的精铁宝箱，开启后有概率获得稀有装备与材料。耐久度归零后碎裂。</div>
        <div class="detail-attrs">
          <div class="attr"><span class="attr-val">+128</span><span class="attr-label">攻击</span></div>
          <div class="attr"><span class="attr-val">+64</span><span class="attr-label">防御</span></div>
          <div class="attr"><span class="attr-val">+12%</span><span class="attr-label">暴击</span></div>
        </div>
        <div class="detail-desc"><span style="font-weight:700">套装效果：</span><span>2 件</span>提升 15% 移速；<span>4 件</span>触发反击。</div>
        <div class="detail-actions">
          <button class="btn btn-use">使用</button>
          <button class="btn btn-drop">丢弃</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
