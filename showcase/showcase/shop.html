<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Yio 靶子冻结 Showcase · 商店</title>
  <style>
  .root {display:flex;flex-direction:column; width:100vw; height:100vh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background-color:#0e1620; }
  .body {display:flex;flex-direction:column; flex-grow:1; padding:32px; gap:24px; overflow-y:auto; }
  .page-title { color:#e0e6ec; font-size:28px; font-weight:700; }
  .grid {display:flex; flex-direction:row; flex-wrap:wrap; gap:24px; }
  .product {display:flex;flex-direction:column; width:320px; background-color:rgba(21,36,51,0.72); border-radius:10px; padding:20px; gap:14px; transition:transform .15s; }
  .product:hover { transform:translateY(-6px); }
  .product-img { width:140px; height:140px; background-color:rgba(26,47,69,0.85); border-radius:10px; align-self:center; }
  .product-name { color:#e0e6ec; font-size:18px; font-weight:700; }
  .product-price { color:#d4a44e; font-size:20px; font-weight:700; }
  .product-meta {display:flex; flex-direction:row; justify-content:space-between; align-items:center; }
  .stock-row {display:flex; flex-direction:row; align-items:center; gap:8px; }
  .stock-label { color:#9aa0b4; font-size:13px; min-width:56px; }
  .btn-buy { background-color:#d4a44e; color:#0e1620; font-size:15px; font-weight:700; padding:10px 20px; border-radius:10px; align-self:flex-start; }
  .btn-buy:hover { filter:brightness(1.12); }
  .link-detail { color:#5fb4d4; font-size:14px; }
  .dialog-overlay {display:flex;flex-direction:column; position:absolute; top:0; left:0; width:100vw; height:100vh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background-color:#000a; justify-content:center; align-items:center; }
  .dialog {display:flex;flex-direction:column; width:416px; background-color:rgba(21,36,51,0.72); border-radius:10px; padding:32px; gap:20px; box-shadow:0 12px 48px #000c; }
  .dialog-title { color:#e0e6ec; font-size:22px; font-weight:700; }
  .dialog-row {display:flex; flex-direction:row; align-items:center; justify-content:space-between; }
  .dialog-label { color:#9aa0b4; font-size:15px; }
  /* NumberField（spinbutton · qty）：无 UA 样式表，CSS 须提供 background/border + caret-color */
  .qty { background-color:rgba(26,47,69,0.85); border-width:0 0 0 2px; border-style:solid; border-color:#2a5a75; color:#e0e6ec; font-size:18px; padding:8px 12px; border-radius:6px; width:64px; text-align:center; caret-color:#5fb4d4; }
  .balance-row {display:flex; flex-direction:row; align-items:center; gap:10px; }
  .dialog-actions {display:flex; flex-direction:row; gap:12px; justify-content:flex-end; }
  .btn-confirm { background-color:#5fb4d4; color:#0e1620; font-size:15px; font-weight:700; padding:10px 24px; border-radius:10px; }
  .btn-cancel { background-color:rgba(26,47,69,0.85); color:#9aa0b4; font-size:15px; padding:10px 24px; border-radius:10px; }
  /* ProgressBar：控件本身是轨道（spec §2.2），作者写 data-slot=fill 子节点（width:% 由 value 驱动） */
  [role="progressbar"] { background-color:rgba(26,47,69,0.85); border-radius:4px; overflow:hidden; height:8px; }
  [role="progressbar"] [data-slot="fill"] { background-color:#5fb4d4; height:100%; }
  </style>
</head>
<body>
  <div class="root">
    <page-top id="page-top"><span slot="title" class="pt-title" style="color:#e0e6ec;font-size:20px;font-weight:700">商店</span></page-top>
    <div class="body">
      <div class="page-title">限时折扣</div>
      <div class="grid">
        <div class="product">
          <img class="product-img" src="../res/icons/item-wand.png" alt="product">
          <span class="product-name">新手礼包</span>
          <span class="product-price">¥ 6</span>
          <div class="product-meta">
            <div class="stock-row"><span class="stock-label">倒计时</span><div role="progressbar" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100" style="flex-grow:1;"><div data-slot="fill"></div></div></div>
            <button class="link-detail">详情</button>
          </div>
          <button class="btn-buy" data-open-dialog="buy-dialog">购买</button>
        </div>
        <div class="product">
          <img class="product-img" src="../res/icons/character.png" alt="product">
          <span class="product-name">勇者外观包</span>
          <span class="product-price">¥ 30</span>
          <div class="product-meta">
            <div class="stock-row"><span class="stock-label">库存</span><div role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100" style="flex-grow:1;"><div data-slot="fill"></div></div></div>
            <button class="link-detail">详情</button>
          </div>
          <button class="btn-buy" data-open-dialog="buy-dialog">购买</button>
        </div>
        <div class="product">
          <img class="product-img" src="../res/icons/item-chest.png" alt="product">
          <span class="product-name">传说宝箱</span>
          <span class="product-price">¥ 98</span>
          <div class="product-meta">
            <div class="stock-row"><span class="stock-label">倒计时</span><div role="progressbar" aria-valuenow="8" aria-valuemin="0" aria-valuemax="100" style="flex-grow:1;"><div data-slot="fill"></div></div></div>
            <button class="link-detail">详情</button>
          </div>
          <button class="btn-buy" data-open-dialog="buy-dialog">购买</button>
        </div>
      </div>
    </div>
    <div class="dialog-overlay" role="dialog" id="buy-dialog" style="display:none">
      <div class="dialog">
        <span class="dialog-title">确认购买</span>
        <div class="dialog-row">
          <span class="dialog-label">购买数量</span>
          <div role="spinbutton" class="qty" aria-valuenow="1" aria-valuemin="1" aria-valuemax="99" data-step="1"></div>
        </div>
        <div class="dialog-row balance-row">
          <span class="dialog-label">余额</span>
          <div role="progressbar" aria-valuenow="4200" aria-valuemin="0" aria-valuemax="5000" style="width:200px;"><div data-slot="fill"></div></div>
        </div>
        <div class="dialog-actions">
          <button class="btn-cancel" data-close-dialog>取消</button>
          <button class="btn-confirm" data-close-dialog>确认</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
